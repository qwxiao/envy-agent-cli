[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envy-agent-cli"
version = "0.1.0"
description = "终端 Coding Agent CLI（类 Claude Code），核心引擎自研：LLM 流式客户端 + ReAct 主循环 + Tool Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agent", "llm", "cli", "react", "tool-calling", "harness"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 引擎层只依赖 httpx：同步流式客户端手写，不用厂商 SDK（核心链路要吃透）。
# typer 属于**参数层**（CLI 入口的一部分），不是引擎——但入口必须能工作，
# 所以它在核心依赖里，而真正可选的终端 UI 在下面的 repl extras。
dependencies = ["httpx>=0.27", "typer>=0.12"]

[project.optional-dependencies]
# 交互层单独一组：**引擎不需要它们**，只有用交互模式才装。
# 这样 `pip install envy-agent-cli` 拿到的仍是那个轻内核，
# 而 `pip install envy-agent-cli[repl]` 才有完整的终端体验。
repl = ["prompt-toolkit>=3.0", "rich>=13.0"]
dev = ["pytest>=8.0"]

[project.scripts]
envy = "envy_agent_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/envy_agent_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
